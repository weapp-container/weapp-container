name: Install Linux native build dependencies
description: Prepare Skia source builds and deterministic font tests when no prebuilt cache exists
runs:
  using: composite
  steps:
    - name: Install compiler, raster and graphics development libraries
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          clang libclang-dev ninja-build pkg-config python3 \
          libfontconfig1-dev libfreetype6-dev libgl1-mesa-dev libegl1-mesa-dev \
          libx11-dev libxkbcommon-dev libxkbcommon-x11-0 libwayland-dev xvfb xauth \
          fonts-dejavu-core
        pkg-config --exists freetype2 fontconfig
        fc-match sans-serif
