name: Bilingual documentation

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  documentation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --test tools/documentation/*.test.mjs
      - run: node tools/documentation/check.mjs
      - run: node tools/documentation/check-content.mjs
      - run: node tools/documentation/check-workspace.mjs
