name: Checks

on:
  push:
    branches: [main]
  pull_request:
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

jobs:
  simulator-smoke:
    name: Development simulator smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          submodules: true

      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.1
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 24.22.2
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify pinned submodules
        run: pnpm submodule:verify

      - name: Install Linux native build dependencies
        uses: ./.github/actions/setup-linux-native

      - name: Install pinned compiler dependencies
        run: corepack pnpm@12.11.2 --dir vendor/weapp-vite install --frozen-lockfile --ignore-scripts

      - name: Build pinned compiler packages
        run: corepack pnpm@12.11.2 --dir vendor/weapp-vite run build:pkgs

      - name: Cache Rust dependencies
        uses: ./.github/actions/cache-rust-build
        with:
          key: checks-linux

      - name: Run development simulator lifecycle smoke
        run: >-
          pnpm simulator:dev:smoke -- --timeout 180000
          --out "$RUNNER_TEMP/simulator-smoke.json"

      - name: Verify smoke restored its fixture
        if: always()
        run: git diff --exit-code -- examples/apps/reference-app

      - name: Upload simulator evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: simulator-dev-smoke
          path: ${{ runner.temp }}/simulator-smoke.json
          if-no-files-found: ignore
          retention-days: 14

  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          submodules: true

      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.1
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 24.22.2
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Linux native build dependencies
        uses: ./.github/actions/setup-linux-native

      - name: Install Rust lint component
        run: rustup component add clippy --toolchain stable

      - name: Cache Rust dependencies
        uses: ./.github/actions/cache-rust-build
        with:
          key: checks-linux

      - name: Verify portable fixtures and API inventory
        run: |
          pnpm conformance:verify
          pnpm api:inventory:verify
          node scripts/check-toolchain.mjs --json

      - name: Verify dependency and source policies
        run: |
          pnpm deps:check:strict
          pnpm opensource:check

      - name: Build and check TypeScript packages
        run: |
          pnpm build
          pnpm typecheck
          pnpm test:types
          pnpm lint

      - name: Test TypeScript packages and real QuickJS runtime
        run: pnpm test

      - name: Verify published tarballs in an external consumer
        run: pnpm testing:install:test

      - name: Build dynamic SDK library for C ABI tests
        run: cargo build -p container-sdk-ffi --locked

      - name: Test Rust workspace
        run: cargo test --workspace --locked -- --test-threads=2

      - name: Enforce Rust lint cleanliness
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
