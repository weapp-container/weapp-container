name: DevTools release

on:
  push:
    tags: ['devtools-v*']

permissions:
  contents: read

concurrency:
  group: devtools-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: macos-universal
            os: xcode-27
          - target: linux-x86_64
            os: ubuntu-22.04
          - target: windows-x86_64
            os: windows-2022
    env:
      CARGO_INCREMENTAL: '0'
      RUSTUP_TOOLCHAIN: 1.99.1
      WEAPP_DEVTOOLS_UPDATE_MANIFEST_URL: https://github.com/weapp-container/weapp-container/releases/latest/download/updates.json
      WEAPP_DEVTOOLS_UPDATE_PUBLIC_KEY: ${{ vars.WEAPP_DEVTOOLS_UPDATE_PUBLIC_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.1
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 24.22.2
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.99.1'
          targets: ${{ matrix.target == 'macos-universal' && 'aarch64-apple-darwin,x86_64-apple-darwin' || matrix.target == 'windows-x86_64' && 'x86_64-pc-windows-msvc' || 'x86_64-unknown-linux-gnu' }}

      - uses: ./.github/actions/setup-linux-native
        if: runner.os == 'Linux'

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Install the pinned compiler dependency graph
        run: corepack pnpm@12.11.2 --dir vendor/weapp-vite install --frozen-lockfile --ignore-scripts

      - name: Prepare stable macOS signing keychain
        if: ${{ matrix.target == 'macos-universal' && !contains(github.ref_name, '-preview.') }}
        shell: bash
        env:
          WEAPP_DEVTOOLS_MACOS_CERTIFICATE_BASE64: ${{ secrets.WEAPP_DEVTOOLS_MACOS_CERTIFICATE_BASE64 }}
          WEAPP_DEVTOOLS_MACOS_CERTIFICATE_PASSWORD: ${{ secrets.WEAPP_DEVTOOLS_MACOS_CERTIFICATE_PASSWORD }}
          WEAPP_DEVTOOLS_MACOS_KEYCHAIN_PASSWORD: ${{ secrets.WEAPP_DEVTOOLS_MACOS_KEYCHAIN_PASSWORD }}
          WEAPP_DEVTOOLS_MACOS_SIGNING_IDENTITY: ${{ secrets.WEAPP_DEVTOOLS_MACOS_SIGNING_IDENTITY }}
          WEAPP_DEVTOOLS_MACOS_NOTARY_KEY_BASE64: ${{ secrets.WEAPP_DEVTOOLS_MACOS_NOTARY_KEY_BASE64 }}
          WEAPP_DEVTOOLS_MACOS_NOTARY_KEY_ID: ${{ secrets.WEAPP_DEVTOOLS_MACOS_NOTARY_KEY_ID }}
          WEAPP_DEVTOOLS_MACOS_NOTARY_ISSUER: ${{ secrets.WEAPP_DEVTOOLS_MACOS_NOTARY_ISSUER }}
        run: |
          set -euo pipefail
          test -n "$WEAPP_DEVTOOLS_MACOS_CERTIFICATE_BASE64"
          test -n "$WEAPP_DEVTOOLS_MACOS_CERTIFICATE_PASSWORD"
          test -n "$WEAPP_DEVTOOLS_MACOS_KEYCHAIN_PASSWORD"
          test -n "$WEAPP_DEVTOOLS_MACOS_SIGNING_IDENTITY"
          test -n "$WEAPP_DEVTOOLS_MACOS_NOTARY_KEY_BASE64"
          test -n "$WEAPP_DEVTOOLS_MACOS_NOTARY_KEY_ID"
          test -n "$WEAPP_DEVTOOLS_MACOS_NOTARY_ISSUER"
          keychain="$RUNNER_TEMP/weapp-devtools-signing.keychain-db"
          certificate="$RUNNER_TEMP/weapp-devtools-signing.p12"
          notary_key="$RUNNER_TEMP/weapp-devtools-notary-key.p8"
          printf '%s' "$WEAPP_DEVTOOLS_MACOS_CERTIFICATE_BASE64" | base64 -D > "$certificate"
          printf '%s' "$WEAPP_DEVTOOLS_MACOS_NOTARY_KEY_BASE64" | base64 -D > "$notary_key"
          chmod 600 "$certificate" "$notary_key"
          security create-keychain -p "$WEAPP_DEVTOOLS_MACOS_KEYCHAIN_PASSWORD" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$WEAPP_DEVTOOLS_MACOS_KEYCHAIN_PASSWORD" "$keychain"
          security import "$certificate" -k "$keychain" -P "$WEAPP_DEVTOOLS_MACOS_CERTIFICATE_PASSWORD" -A -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: -s -k "$WEAPP_DEVTOOLS_MACOS_KEYCHAIN_PASSWORD" "$keychain"
          security list-keychains -d user -s "$keychain"
          security default-keychain -s "$keychain"
          echo "WEAPP_DEVTOOLS_MACOS_NOTARY_KEY_PATH=$notary_key" >> "$GITHUB_ENV"

      - name: Validate stable update public key
        if: ${{ !contains(github.ref_name, '-preview.') }}
        env:
          WEAPP_DEVTOOLS_UPDATE_PUBLIC_KEY: ${{ vars.WEAPP_DEVTOOLS_UPDATE_PUBLIC_KEY }}
        run: |
          test -n "$WEAPP_DEVTOOLS_UPDATE_PUBLIC_KEY"
          printf '%s\n' "$WEAPP_DEVTOOLS_UPDATE_PUBLIC_KEY" | openssl pkey -pubin -noout

      - name: Build the portable manifest packer
        run: pnpm --dir tools/container-manifest build

      - name: Build universal macOS simulator
        if: matrix.target == 'macos-universal'
        shell: bash
        env:
          WEAPP_DEVTOOLS_MACOS_SIGNING_IDENTITY: ${{ secrets.WEAPP_DEVTOOLS_MACOS_SIGNING_IDENTITY }}
          WEAPP_DEVTOOLS_MACOS_NOTARY_KEY_PATH: ${{ runner.temp }}/weapp-devtools-notary-key.p8
          WEAPP_DEVTOOLS_MACOS_NOTARY_KEY_ID: ${{ secrets.WEAPP_DEVTOOLS_MACOS_NOTARY_KEY_ID }}
          WEAPP_DEVTOOLS_MACOS_NOTARY_ISSUER: ${{ secrets.WEAPP_DEVTOOLS_MACOS_NOTARY_ISSUER }}
        run: |
          cargo build --locked --release -p container-simulator --features desktop-window --target aarch64-apple-darwin
          cargo build --locked --release -p container-simulator --features desktop-window --target x86_64-apple-darwin
          node scripts/package-devtools-release.mjs \
            --target macos-universal \
            --output "artifacts/weapp-container-devtools-${{ matrix.target }}" \
            --version "${GITHUB_REF_NAME#devtools-v}" \
            --simulator-bin target/aarch64-apple-darwin/release/weapp-simulator \
            --simulator-bin-x86_64 target/x86_64-apple-darwin/release/weapp-simulator

      - name: Validate macOS DMG installation layout
        if: matrix.target == 'macos-universal'
        shell: bash
        run: |
          set -euo pipefail
          mount_point="$RUNNER_TEMP/devtools-dmg"
          mkdir -p "$mount_point"
          hdiutil attach -nobrowse -readonly -mountpoint "$mount_point" artifacts/weapp-container-devtools-macos-universal.dmg
          trap 'hdiutil detach "$mount_point" -quiet' EXIT
          app="$mount_point/Weapp Container DevTools.app"
          plutil -lint "$app/Contents/Info.plist"
          test -x "$app/Contents/MacOS/WeappContainerDevTools"
          "$app/Contents/Resources/node/bin/node" "$app/Contents/Resources/scripts/devtools-launcher.mjs" --help
          if [[ "$GITHUB_REF_NAME" != *-preview.* ]]; then
            codesign --verify --deep --strict --verbose=2 "$app"
            spctl --assess --type open --verbose=2 "$app"
          fi

      - name: Build Linux simulator
        if: matrix.target == 'linux-x86_64'
        run: cargo build --locked --release -p container-simulator --features desktop-window

      - name: Package Linux DevTools
        if: matrix.target == 'linux-x86_64'
        run: node scripts/package-devtools-release.mjs --target linux-x86_64 --output "artifacts/weapp-container-devtools-${{ matrix.target }}" --version "${GITHUB_REF_NAME#devtools-v}" --simulator-bin target/release/weapp-simulator

      - name: Validate Linux DEB installation and launcher
        if: matrix.target == 'linux-x86_64'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get install -y ./artifacts/weapp-container-devtools-linux-x86_64.deb
          test -f /usr/share/applications/weapp-container-devtools.desktop
          weapp-devtools --help
          sudo apt-get remove -y weapp-container-devtools

      - name: Build Windows simulator
        if: matrix.target == 'windows-x86_64'
        run: cargo build --locked --release -p container-simulator --features desktop-window

      - name: Install WiX Toolset
        if: matrix.target == 'windows-x86_64'
        shell: pwsh
        run: |
          choco install wixtoolset --yes --no-progress
          $heat = Get-ChildItem @(
            "${env:ProgramFiles(x86)}\WiX Toolset*\bin\heat.exe",
            "${env:ProgramFiles}\WiX Toolset*\bin\heat.exe"
          ) -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $heat) { throw 'WiX Toolset heat.exe was not found' }
          $wixBin = Split-Path $heat.FullName
          foreach ($tool in @('candle.exe', 'light.exe')) {
            if (-not (Test-Path (Join-Path $wixBin $tool))) { throw "WiX Toolset $tool was not found" }
          }
          Add-Content -Path $env:GITHUB_PATH -Value $wixBin

      - name: Prepare stable Windows signing tool
        if: ${{ matrix.target == 'windows-x86_64' && !contains(github.ref_name, '-preview.') }}
        shell: pwsh
        env:
          WEAPP_DEVTOOLS_WINDOWS_SIGNING_CERTIFICATE_BASE64: ${{ secrets.WEAPP_DEVTOOLS_WINDOWS_SIGNING_CERTIFICATE_BASE64 }}
          WEAPP_DEVTOOLS_WINDOWS_SIGNING_CERTIFICATE_PASSWORD: ${{ secrets.WEAPP_DEVTOOLS_WINDOWS_SIGNING_CERTIFICATE_PASSWORD }}
        run: |
          if (-not $env:WEAPP_DEVTOOLS_WINDOWS_SIGNING_CERTIFICATE_BASE64) { throw 'WEAPP_DEVTOOLS_WINDOWS_SIGNING_CERTIFICATE_BASE64 is required for stable releases' }
          if (-not $env:WEAPP_DEVTOOLS_WINDOWS_SIGNING_CERTIFICATE_PASSWORD) { throw 'WEAPP_DEVTOOLS_WINDOWS_SIGNING_CERTIFICATE_PASSWORD is required for stable releases' }
          $signtool = Get-ChildItem @(
            "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe",
            "${env:ProgramFiles}\Windows Kits\10\bin\*\x64\signtool.exe"
          ) -ErrorAction SilentlyContinue | Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $signtool) { throw 'Windows SDK signtool.exe was not found' }
          $certificate = Join-Path $env:RUNNER_TEMP 'weapp-devtools-signing.pfx'
          [IO.File]::WriteAllBytes($certificate, [Convert]::FromBase64String($env:WEAPP_DEVTOOLS_WINDOWS_SIGNING_CERTIFICATE_BASE64))
          Add-Content -Path $env:GITHUB_ENV -Value "WEAPP_DEVTOOLS_WINDOWS_SIGNTOOL=$($signtool.FullName)"
          Add-Content -Path $env:GITHUB_ENV -Value "WEAPP_DEVTOOLS_WINDOWS_SIGNING_CERTIFICATE_PATH=$certificate"

      - name: Package Windows DevTools
        if: matrix.target == 'windows-x86_64'
        shell: pwsh
        env:
          WEAPP_DEVTOOLS_WINDOWS_SIGNING_CERTIFICATE_PASSWORD: ${{ secrets.WEAPP_DEVTOOLS_WINDOWS_SIGNING_CERTIFICATE_PASSWORD }}
        run: |
          $drive = 'R:'
          if (Test-Path "$drive\") { throw "Temporary drive $drive is already in use" }
          subst $drive $env:GITHUB_WORKSPACE
          try {
            $version = $env:GITHUB_REF_NAME -replace '^devtools-v', ''
            $output = "$drive\artifacts\weapp-container-devtools-${{ matrix.target }}"
            node scripts/package-devtools-release.mjs --target windows-x86_64 --output $output --version $version --simulator-bin target/release/weapp-simulator.exe
            if ($LASTEXITCODE -ne 0) { throw "Windows DevTools packaging failed with $LASTEXITCODE" }
          } finally {
            subst $drive /D
          }

      - name: Validate Windows MSI installation and upgrade entry
        if: matrix.target == 'windows-x86_64'
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME -replace '^devtools-v', ''
          $productCode = node --input-type=module -e "import { msiProductCode } from './scripts/lib/devtools-installers.mjs'; console.log(msiProductCode(process.argv[1]))" $version
          $msi = (Resolve-Path "artifacts/weapp-container-devtools-windows-x86_64.msi").Path
          $install = Join-Path $env:LOCALAPPDATA 'Weapp Container DevTools'
          $installResult = Start-Process msiexec.exe -ArgumentList @('/i', "`"$msi`"", '/qn', '/norestart') -Wait -PassThru
          if ($installResult.ExitCode -ne 0) { throw "MSI install failed with $($installResult.ExitCode)" }
          $launcher = Join-Path $install 'bin/weapp-devtools.cmd'
          if (-not (Test-Path $launcher)) { throw 'Installed launcher was not found' }
          & $launcher --help
          if ($LASTEXITCODE -ne 0) { throw "Installed launcher failed with $LASTEXITCODE" }
          $shortcut = Join-Path $env:APPDATA 'Microsoft/Windows/Start Menu/Programs/Weapp Container DevTools/Weapp Container DevTools.lnk'
          if (-not (Test-Path $shortcut)) { throw 'Start Menu shortcut was not installed' }
          if ($env:GITHUB_REF_NAME -notlike '*-preview.*') {
            & $env:WEAPP_DEVTOOLS_WINDOWS_SIGNTOOL verify /pa /all $msi
            if ($LASTEXITCODE -ne 0) { throw "MSI Authenticode verification failed with $LASTEXITCODE" }
          }
          $removeResult = Start-Process msiexec.exe -ArgumentList @('/x', $productCode, '/qn', '/norestart') -Wait -PassThru
          if ($removeResult.ExitCode -ne 0) { throw "MSI uninstall failed with $($removeResult.ExitCode)" }
          if (Test-Path $install) { throw 'MSI install directory remained after uninstall' }

      - name: Run DevTools release regression tests
        run: pnpm devtools:release:test

      - uses: actions/upload-artifact@v4
        with:
          name: devtools-${{ matrix.target }}
          path: artifacts/weapp-container-devtools-${{ matrix.target }}.*
          compression-level: 0
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish downloadable DevTools release
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24.22.2
      - uses: actions/download-artifact@v4
        with:
          pattern: devtools-*
          path: artifacts
          merge-multiple: true

      - name: Verify packages and create release checksums
        run: |
          set -euo pipefail
          ls -lh artifacts
          expected=(
            weapp-container-devtools-macos-universal.dmg
            weapp-container-devtools-macos-universal.tar.gz
            weapp-container-devtools-linux-x86_64.deb
            weapp-container-devtools-linux-x86_64.tar.gz
            weapp-container-devtools-windows-x86_64.msi
            weapp-container-devtools-windows-x86_64.zip
          )
          for asset in "${expected[@]}"; do test -f "artifacts/$asset"; done
          test "$(find artifacts -maxdepth 1 -type f | wc -l)" -eq "${#expected[@]}"
          cd artifacts
          sha256sum weapp-container-devtools-* > SHA256SUMS
          sha256sum --check SHA256SUMS

      - name: Create signed stable update manifest
        if: ${{ !contains(github.ref_name, '-preview.') }}
        env:
          WEAPP_DEVTOOLS_UPDATE_PRIVATE_KEY: ${{ secrets.WEAPP_DEVTOOLS_UPDATE_PRIVATE_KEY }}
          WEAPP_DEVTOOLS_UPDATE_PUBLIC_KEY: ${{ vars.WEAPP_DEVTOOLS_UPDATE_PUBLIC_KEY }}
        run: |
          set -euo pipefail
          test -n "$WEAPP_DEVTOOLS_UPDATE_PRIVATE_KEY"
          node scripts/create-devtools-update-manifest.mjs \
            --assets artifacts \
            --version "${GITHUB_REF_NAME#devtools-v}" \
            --tag "$GITHUB_REF_NAME" \
            --output artifacts/updates.json
          sha256sum artifacts/updates.json >> artifacts/SHA256SUMS

      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          notes_file="$RUNNER_TEMP/devtools-release-notes.md"
          preview_args=()
          if [[ "$GITHUB_REF_NAME" == *-preview.* ]]; then
            preview_args+=(--prerelease)
            cat > "$notes_file" <<'EOF'
          This preview release includes installable and portable Weapp Container DevTools packages. macOS and Windows installers are unsigned preview builds and may show operating-system security prompts.
          EOF
          else
            cat > "$notes_file" <<'EOF'
          This stable release includes installable and portable Weapp Container DevTools packages. The macOS app and DMG are Developer ID signed and notarized, the Windows MSI is Authenticode signed, and the update manifest is signed with the Weapp Container DevTools release key.
          EOF
          fi
          assets=(
            artifacts/weapp-container-devtools-macos-universal.dmg
            artifacts/weapp-container-devtools-macos-universal.tar.gz
            artifacts/weapp-container-devtools-linux-x86_64.deb
            artifacts/weapp-container-devtools-linux-x86_64.tar.gz
            artifacts/weapp-container-devtools-windows-x86_64.msi
            artifacts/weapp-container-devtools-windows-x86_64.zip
            artifacts/SHA256SUMS
          )
          if [[ -f artifacts/updates.json ]]; then assets+=(artifacts/updates.json); fi
          title="Weapp Container DevTools ${GITHUB_REF_NAME#devtools-v}"
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release edit "$GITHUB_REF_NAME" --title "$title" --notes-file "$notes_file" "${preview_args[@]}"
            gh release upload "$GITHUB_REF_NAME" "${assets[@]}" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "${assets[@]}" \
              --verify-tag \
              --title "$title" \
              --notes-file "$notes_file" \
              "${preview_args[@]}"
          fi
          gh release view "$GITHUB_REF_NAME" --json isDraft,isPrerelease,assets --jq '.assets[].name' | sort > "$RUNNER_TEMP/release-assets.txt"
          printf '%s\n' \
            SHA256SUMS \
            weapp-container-devtools-linux-x86_64.deb \
            weapp-container-devtools-linux-x86_64.tar.gz \
            weapp-container-devtools-macos-universal.dmg \
            weapp-container-devtools-macos-universal.tar.gz \
            weapp-container-devtools-windows-x86_64.msi \
            weapp-container-devtools-windows-x86_64.zip | sort > "$RUNNER_TEMP/expected-release-assets.txt"
          if [[ -f artifacts/updates.json ]]; then printf '%s\n' updates.json >> "$RUNNER_TEMP/expected-release-assets.txt"; sort -o "$RUNNER_TEMP/expected-release-assets.txt" "$RUNNER_TEMP/expected-release-assets.txt"; fi
          diff -u "$RUNNER_TEMP/expected-release-assets.txt" "$RUNNER_TEMP/release-assets.txt"
          release_state="$(gh release view "$GITHUB_REF_NAME" --json isDraft,isPrerelease --jq '[.isDraft, .isPrerelease] | @tsv')"
          if [[ "$GITHUB_REF_NAME" == *-preview.* ]]; then expected_state=$'false\ttrue'; else expected_state=$'false\tfalse'; fi
          test "$release_state" = "$expected_state"

          version="${GITHUB_REF_NAME#devtools-v}"
          if [[ "$version" =~ ^(.+-preview\.[0-9]+)\.([0-9]+)$ ]]; then
            series="${BASH_REMATCH[1]}"
            revision=$((10#${BASH_REMATCH[2]} - 1))
            if (( revision > 0 )); then
              previous_tag="devtools-v${series}.${revision}"
              if gh release view "$previous_tag" >/dev/null 2>&1; then
                previous_notes="$RUNNER_TEMP/previous-release-notes.md"
                gh release view "$previous_tag" --json body --jq '.body' > "$previous_notes"
                marker="Superseded by $GITHUB_REF_NAME"
                if ! grep -Fq "$marker" "$previous_notes"; then
                  printf '\n\nSuperseded by [%s](https://github.com/%s/releases/tag/%s).\n' \
                    "$GITHUB_REF_NAME" "$GH_REPO" "$GITHUB_REF_NAME" >> "$previous_notes"
                  gh release edit "$previous_tag" --notes-file "$previous_notes"
                fi
              fi
            fi
          fi
