name: Desktop SDK installed consumers
on:
  workflow_dispatch:
    inputs:
      suite:
        description: SDK validation group (full retains the complete platform matrix)
        type: choice
        default: quick
        options: [quick, full, showcase]
      platform:
        description: Platform selection for non-full runs
        type: choice
        default: linux
        options: [linux, macos, windows, all]
      native_input:
        description: Reviewed existing native input key (empty compiles a new runtime)
        type: string
        default: ''
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ inputs.suite }}-${{ inputs.platform }}
  cancel-in-progress: ${{ inputs.suite == 'quick' }}

permissions:
  contents: read
env:
  CARGO_INCREMENTAL: '0'
jobs:
  source-contracts:
    if: inputs.suite != 'showcase'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.99.1'
      - name: License inventory contracts
        run: node --test scripts/sdk-licenses.test.mjs scripts/lib/sdk-notice.test.mjs
      - run: node --test sdk/desktop/test/*.test.mjs
  desktop:
    if: inputs.suite == 'full'
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: macos-15, target: aarch64-apple-darwin, desktop: macos-universal, features: "quickjs-native,skia-gpu-metal"}
          - {os: windows-2022, target: x86_64-pc-windows-msvc, desktop: windows-x64, features: "quickjs-native,skia-gpu-gles"}
          - {os: ubuntu-22.04, target: x86_64-unknown-linux-gnu, desktop: linux-x64, features: "quickjs-native,skia-gpu-gles"}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
          submodules: recursive
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.99.1'
          targets: ${{ matrix.target }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24.18.0'
      - name: Linux compiler, GTK3 and both display backends
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ninja-build clang libclang-dev pkg-config libfontconfig1-dev libgl1-mesa-dev libgtk-3-dev xvfb weston
      - uses: ./.github/actions/cache-rust-build
        with:
          key: sdk-desktop-${{ matrix.target }}
      - name: Build native core distribution
        run: node scripts/sdk-native-build.mjs --target ${{ matrix.target }}
      - name: macOS Intel slice
        if: runner.os == 'macOS'
        run: |
          rustup target add x86_64-apple-darwin
          node scripts/sdk-native-build.mjs --target x86_64-apple-darwin
      - name: Native dependency license inventory
        run: node scripts/sdk-licenses.mjs --target ${{ matrix.target }} --features ${{ matrix.features }}
      - name: macOS Intel license inventory
        if: runner.os == 'macOS'
        run: node scripts/sdk-licenses.mjs --target x86_64-apple-darwin --features quickjs-native,skia-gpu-metal
      - name: Build, install and execute independent native C/C++ consumer
        if: runner.os != 'Linux'
        run: node scripts/sdk-desktop-package.mjs --target ${{ matrix.desktop }} --verify
      - name: Linux X11 installed consumer
        if: runner.os == 'Linux'
        run: xvfb-run -a env GDK_BACKEND=x11 node scripts/sdk-desktop-package.mjs --target linux-x64 --verify
      - name: Linux Wayland installed consumer
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          runtime_dir=$(mktemp -d)
          chmod 700 "$runtime_dir"
          export XDG_RUNTIME_DIR="$runtime_dir"
          weston --backend=headless-backend.so --use-pixman --socket=weapp-sdk-wayland --idle-time=0 --width=1024 --height=768 --no-config > artifacts/sdk/desktop/weston.log 2>&1 &
          weston_pid=$!
          trap 'kill "$weston_pid" 2>/dev/null || true; wait "$weston_pid" 2>/dev/null || true; rm -rf "$runtime_dir"' EXIT
          for _attempt in $(seq 1 100); do test -S "$runtime_dir/weapp-sdk-wayland" && break; sleep 0.1; done
          test -S "$runtime_dir/weapp-sdk-wayland"
          env GDK_BACKEND=wayland WAYLAND_DISPLAY=weapp-sdk-wayland artifacts/sdk/desktop/.consumer-linux-x64/desktop_consumer artifacts/sdk/fixtures/acceptance-pack artifacts/sdk/desktop/linux-x64/wayland-result.txt
      - name: Produce immutable runtime and SDK archives
        shell: bash
        run: |
          node scripts/dev-player-runtime-archives.mjs --runtime-root artifacts/sdk --platform ${{ runner.os == 'macOS' && 'macos' || runner.os == 'Windows' && 'windows' || 'linux' }} --out artifacts/runtime-archives
      - name: Fresh archive installed C/C++ consumer
        if: runner.os != 'Linux'
        run: node scripts/sdk-desktop-consumer.mjs --manifest artifacts/runtime-archives/runtime-artifacts.lock.json --artifact-dir artifacts/runtime-archives --out artifacts/archive-validation
      - name: Fresh archive Linux X11 consumer
        if: runner.os == 'Linux'
        run: xvfb-run -a env GDK_BACKEND=x11 node scripts/sdk-desktop-consumer.mjs --manifest artifacts/runtime-archives/runtime-artifacts.lock.json --artifact-dir artifacts/runtime-archives --out artifacts/archive-validation
      - name: Fresh archive macOS Intel consumer
        if: runner.os == 'macOS'
        run: node scripts/sdk-desktop-consumer.mjs --manifest artifacts/runtime-archives/runtime-artifacts.lock.json --artifact-dir artifacts/runtime-archives --arch x64 --out artifacts/archive-validation
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: desktop-sdk-${{ matrix.desktop }}
          path: |
            artifacts/sdk/desktop/${{ matrix.desktop }}/
            artifacts/sdk/desktop/weston.log
            artifacts/runtime-archives/
            artifacts/archive-validation/
          retention-days: 7
          if-no-files-found: error

  showcase:
    if: inputs.suite == 'showcase'
    # GitHub hides private draft releases from a contents:read installation.
    # The token stays in this repository and is exposed only to input restore.
    permissions:
      contents: write
      actions: read
    uses: ./.github/workflows/showcase-native.yml
    with:
      platform: ${{ inputs.platform }}
      native_input: ${{ inputs.native_input }}
