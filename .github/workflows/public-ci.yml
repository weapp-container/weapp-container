name: Public source checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: public-source-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_INCREMENTAL: '0'

jobs:
  source:
    name: Source and contract checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v4
      - run: pnpm install --frozen-lockfile
      - uses: dtolnay/rust-toolchain@stable
      - run: pnpm submodule:verify
      - run: pnpm opensource:check && pnpm docs:check
      - run: node scripts/generate-host-services-matrix.mjs --check
      - run: node --test scripts/core-api-inventory.test.mjs scripts/host-api-matrix.test.mjs scripts/host-api-matrix-io.test.mjs
      - run: pnpm naming:check && pnpm naming:test
      - run: pnpm container:manifest:test
      - run: npm install --ignore-scripts --no-audit --no-fund
        working-directory: sdk/react-native
      - run: pnpm sdk:contracts:test
      - run: pnpm runtime:artifacts:test
      - run: node --test scripts/check-open-source.test.mjs scripts/check-doc-links.test.mjs scripts/verify-submodule.test.mjs scripts/sdk-licenses.test.mjs scripts/sdk-native-build.test.mjs scripts/check-product-naming.test.mjs scripts/check-toolchain.test.mjs

  rust:
    name: Rust workspace
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v4
      - run: pnpm install --frozen-lockfile
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: ./.github/actions/setup-linux-native
      - uses: ./.github/actions/cache-downloads
        with:
          cargo: 'true'
      - run: cargo fmt --all -- --check
      - run: cargo check --workspace --all-targets --locked
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Check desktop GPU integration
        run: cargo clippy -p container-simulator --all-targets --features desktop-window --locked -- -D warnings
      - name: Exercise an X11 GL drawable with Mesa (not hardware GPU acceptance)
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: xvfb-run -a cargo test -p container-host-desktop -p container-simulator --features container-simulator/desktop-window --locked x11_gl_drawable_renders_resizes_reloads_and_detaches -- --ignored --test-threads=1 --nocapture
      # Deadline-sensitive engine contracts share the runner's CPU budget.
      - run: cargo test --workspace --no-fail-fast --locked -- --test-threads=1
