name: Testing runtime
on:
  pull_request:
    paths: ['crates/**', 'packages/**', 'tools/container-manifest/**', 'scripts/*test-runtime*', 'scripts/sdk-licenses.mjs', 'package.json', '*lock*', 'pnpm-workspace.yaml', 'repoctl.config.ts', 'tsconfig.json', 'turbo.json', 'eslint.config.mjs', '.node-version', '.github/workflows/testing-runtime.yml']
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            platform: darwin-arm64
          - os: ubuntu-24.04
            platform: linux-x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.2'
      - uses: pnpm/action-setup@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: ./.github/actions/cache-downloads
        with:
          cargo: 'true'
          pnpm-project: '.'
      - run: pnpm install --frozen-lockfile
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked -p container-sdk --features testing --all-targets -- -D warnings
      - run: cargo test --locked -p container-sdk --features testing -- --test-threads=1
      - run: pnpm testing:typecheck
      - run: pnpm testing:test
      - run: pnpm testing:package
      - run: pnpm testing:install:test
      - run: pnpm testing:bench
      - uses: actions/upload-artifact@v4
        with:
          name: testing-runtime-${{ matrix.platform }}
          path: |
            packages/runtime/${{ matrix.platform }}/
            artifacts/testing-runtime-benchmark.json
