[package]
name = "container-host-harmony"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true
description = "HarmonyOS ArkTS/FFI host adapter boundary"

[lib]
crate-type = ["rlib", "cdylib"]

[features]
default = ["stub"]
stub = []
harmony = []
arkui = []
skia-backend = ["container-render-skia/skia-backend", "container-runtime/skia-backend"]
gles = []
skia-gpu-gles = [
    "gles",
    "harmony",
    "arkui",
    "skia-backend",
    "container-host-common/skia-gpu-gles",
    "container-runtime/skia-gpu-gles",
]
v8-native = ["container-runtime/v8-native"]
quickjs-native = ["container-runtime/quickjs-native"]
quickjs-native-harmony = ["container-runtime/quickjs-native-harmony"]
restricted-showcase = ["container-runtime/restricted-showcase"]

[dependencies]
fs2 = "0.4"
container-render-skia = { path = "../container-render-skia" }
container-ir = { path = "../container-ir" }
container-core = { path = "../container-core" }
container-bridge = { path = "../container-bridge" }
serde_json = { workspace = true }
container-host-common = { path = "../container-host-common" }
container-runtime = { path = "../container-runtime" }

