[package]
name = "container-host-web"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true
description = "Web host adapter boundary for the portable container"

[lib]
crate-type = ["rlib", "cdylib"]

[features]
default = ["stub"]
stub = []
canvas-kit = []
# Forward provider selection into the shared runtime. Cargo may also enable
# that runtime feature through another dependency; without any compiled V8
# provider, a request for V8 fails during session construction.
v8-native = ["container-runtime/v8-native"]
quickjs-native = ["container-runtime/quickjs-native"]
wasm = ["dep:wasm-bindgen"]
restricted-showcase = ["container-runtime/restricted-showcase"]

[dependencies]
serde.workspace = true
container-render-skia = { path = "../container-render-skia" }
container-ir = { path = "../container-ir" }
container-core = { path = "../container-core" }
container-bridge = { path = "../container-bridge" }
container-host-common = { path = "../container-host-common" }
container-runtime = { path = "../container-runtime" }
serde_json.workspace = true
wasm-bindgen = { version = "0.2", optional = true }

