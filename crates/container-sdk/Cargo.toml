[package]
name = "container-sdk"
version = "0.1.0-preview.7.1"
edition.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true
description = "Embeddable Weapp Container session, verified packs, persistence and asynchronous HTTP"

[features]
default = ["quickjs-native"]
testing = ["quickjs-native", "container-runtime/testing"]
restricted-showcase = ["container-runtime/restricted-showcase"]
quickjs-native = ["container-runtime/quickjs-native"]
quickjs-native-android = ["quickjs-native", "container-runtime/quickjs-native-android"]
quickjs-native-ios = ["quickjs-native", "container-runtime/quickjs-native-ios"]
v8-native = ["container-runtime/v8-native"]
skia-backend = ["container-render-skia/skia-backend"]
skia-gpu-gles = ["skia-backend", "container-runtime/skia-gpu-gles"]
skia-gpu-metal = ["skia-backend", "container-runtime/skia-gpu-metal"]

view-batch-diagnostics = ["container-runtime/view-batch-diagnostics"]
android-view-atrace = ["view-batch-diagnostics", "container-runtime/android-view-atrace"]

[dependencies]
container-core = { path = "../container-core" }
container-ir = { path = "../container-ir" }
container-bridge = { path = "../container-bridge" }
container-runtime = { path = "../container-runtime" }
container-render-skia = { path = "../container-render-skia" }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
fs2 = "0.4"
tempfile = "3"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
tokio = { version = "1", features = ["rt", "sync", "time", "net", "macros"] }

[dev-dependencies]

[[bin]]
name = "weapp-test-host"
path = "src/bin/test-host.rs"
required-features = ["testing"]
