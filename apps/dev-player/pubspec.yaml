name: weapp_container_dev_player
publish_to: none
description: Private native Weapp Container development player.
version: 0.1.0-preview.6.0+1
environment:
  sdk: '>=3.13.0 <4.0.0'
  flutter: '>=3.47.7'
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  weapp_container:
    path: ../../sdk/flutter/weapp_container
  crypto: 3.0.7
  path: 1.9.1
  path_provider: 2.1.6
  flutter_secure_storage: 9.2.4
  app_links: 6.4.1
  mobile_scanner: 7.1.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  path_provider_platform_interface: 2.1.3
  weapp_container_platform_interface:
    path: ../../sdk/flutter/weapp_container_platform_interface
flutter:
  generate: true
  uses-material-design: true
