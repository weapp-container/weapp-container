name: weapp_container_dev_player
publish_to: none
description: Private native Weapp Container development player.
version: 0.1.0-preview.6.0+1
environment:
  sdk: '>=3.13.0 <4.0.0'
  flutter: '>=3.47.7'
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  weapp_container:
    path: ../../sdk/flutter/weapp_container
  crypto: 3.0.8
  path: 1.9.1
  path_provider: 2.1.6
  flutter_secure_storage: 11.2.0
  app_links: 7.2.2
  mobile_scanner: 7.5.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  path_provider_platform_interface: 2.1.3

dependency_overrides:
  weapp_container_platform_interface:
    path: ../../sdk/flutter/weapp_container_platform_interface
flutter:
  generate: true
  uses-material-design: true
